[project]
name = "machine-worklist"
dynamic = ["version"]
description = "Machine attention worklist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.81.0",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.12",
]

[tool.apx.metadata]
app-name = "machine-worklist"
app-slug = "machine_worklist"
app-entrypoint = "machine_worklist.backend.app:app"
api-prefix = "/api"
metadata-path = "src/machine_worklist/_metadata.py"

[tool.apx.ui]
root = "src/machine_worklist/ui"

[tool.apx.ui.registries]
"@animate-ui" = "https://animate-ui.com/r/{name}.json"
"@ai-elements" = "https://registry.ai-sdk.dev/{name}.json"
"@svgl" = "https://svgl.app/r/{name}.json"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.version]
path = "src/machine_worklist/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/machine_worklist/__dist__", "src/machine_worklist/_metadata.py"]
exclude = ["src/machine_worklist/ui"]

[tool.ty.src]
# Installed workshop skills are tools, not application source.
# notebooks/ run on Databricks serverless (spark, dbutils, sklearn), not in the app.
exclude = [".agents/skills/**", ".claude/skills/**", "notebooks/**"]
